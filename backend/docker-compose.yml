services:
  db:
    image: postgres:16
    container_name: upay_pulse_db
    environment:
      POSTGRES_USER: upay
      POSTGRES_PASSWORD: upay
      POSTGRES_DB: upay_pulse
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upay -d upay_pulse"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
